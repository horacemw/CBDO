name: Build and publish site bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbdos-site-bundle
          path: dist
          if-no-files-found: error
          retention-days: 30

  # Optional: automated deploy to Hostinger via FTP.
  # Enable by adding the following repository secrets:
  #   FTP_HOST, FTP_USER, FTP_PASS
  # (In Hostinger: hPanel → Files → FTP accounts.)
  deploy:
    name: Deploy to cbd.digiskills.live
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_FTP_DEPLOY == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: cbdos-site-bundle
          path: dist

      - name: Sync to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /domains/digiskills.live/public_html/cbd/
          dangerous-clean-slate: false
